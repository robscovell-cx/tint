overview:
  name: "tint"
  purpose: "Terminal-based Tetris clone (TINT Is Not Tetris) using ncurses"
  tech:
    - "C"
    - "ncurses"
    - "POSIX"
  architecture: "main() → game loop → engine_evaluate() / engine_move() → board state → ncurses render"

source_files:
  tint.c:
    role: entry-point
    purpose: "main(), game loop, rendering, scoring, highscores, CLI option parsing"
  engine.c:
    role: game-engine
    purpose: "Shape movement, rotation, collision detection, line clearing, engine state"
  engine.h:
    role: header
    purpose: "All game types (engine_t, shape_t, board_t, action_t), engine API, SHAPES global"
  io.c:
    role: io-layer
    purpose: "ncurses wrapper — init/close, color, cursor, input with microsecond timeout"
  io.h:
    role: header
    purpose: "IO API, color/attribute constants"
  utils.c:
    role: utilities
    purpose: "rand_init(), rand_value(), str2int() — RNG and string parsing"
  utils.h:
    role: header
    purpose: "Utility function declarations"
  typedefs.h:
    role: base-types
    purpose: "bool/TRUE/FALSE/ERR/OK macros for portability"
  config.h:
    role: config
    purpose: "Defines scorefile path via SCOREFILE compile-time macro"
  Makefile:
    role: build
    purpose: "Builds tint binary; links ncurses; sets SCOREFILE path"

types:
  engine_t:
    file: "engine.h:81"
    purpose: "Complete mutable game state passed by pointer everywhere"
    key_fields:
      - "board: board_t — 2D array of cell colors/walls"
      - "shapes: shapes_t — mutable copies of all 7 shapes for current game"
      - "curshape, nextshape: int — indices into shapes[]"
      - "curx, cury: int — active piece position"
      - "curx_shadow, cury_shadow: int — shadow piece position"
      - "shadow: bool — whether to render drop shadow"
      - "score: int — raw score (divide by SCOREFACTOR for display)"
      - "bag[NUMSHAPES], bag_iterator: int — 7-bag randomizer state"
      - "status: status_t — moves/rotations/dropcount/efficiency/droppedlines"
      - "score_function: fn ptr — called when piece lands"

  shape_t:
    file: "engine.h:63"
    key_fields:
      - "color: int — ncurses color index"
      - "type: int — shape index (0-6), controls rotation behaviour"
      - "flipped: bool — toggle state for 2-state shapes (types 0,1,6)"
      - "block[NUMBLOCKS]: block_t — 4 relative (x,y) offsets from anchor"

  status_t:
    file: "engine.h:71"
    key_fields:
      - "moves, rotations, dropcount: int — per-piece counters reset on landing"
      - "efficiency: int — running average efficiency metric"
      - "droppedlines: int — total cleared lines (drives level-up)"
      - "currentdroppedlines: int — lines cleared by last piece (for scoring)"

  score_t:
    file: "tint.c:322"
    purpose: "One entry in the highscore file"
    key_fields: ["name[20]: char", "score: int", "timestamp: time_t"]

  action_t:
    file: "engine.h:94"
    values: ["ACTION_LEFT", "ACTION_ROTATE_CLOCKWISE", "ACTION_ROTATE_COUNTERCLOCKWISE", "ACTION_RIGHT", "ACTION_DROP", "ACTION_DOWN"]

constants:
  NUMSHAPES: 7
  NUMBLOCKS: 4
  NUMROWS: 23
  NUMCOLS: 13
  WALL: 16
  MINLEVEL: 1
  MAXLEVEL: 9
  NUMSCORES: 10
  NAMELEN: 20
  SCOREFACTOR: 2
  DELAY: "1000000 / (level + 2)  — microseconds per gravity tick"

public_api:
  engine:
    - "void engine_init(engine_t*, void(*score_fn)(engine_t*)) — zero and populate engine state, place first piece"
    - "void engine_move(engine_t*, action_t) — apply one player action"
    - "int engine_evaluate(engine_t*) — gravity tick; returns 1=fell, 0=landed+new piece, -1=game over"
  io:
    - "void io_init() / void io_close() — ncurses setup/teardown"
    - "void out_setattr(int), out_setcolor(fg,bg), out_gotoxy(x,y)"
    - "void out_putch(char), out_printf(fmt,...), out_refresh()"
    - "int out_width(), out_height(), out_beep()"
    - "int in_getch() — non-blocking read; honours in_timeleft"
    - "void in_timeout(microseconds), in_flush()"
  utils:
    - "void rand_init() — seed RNG from time"
    - "int rand_value(range) — [0, range)"
    - "bool str2int(int *out, const char *str)"

game_loop:
  description: "do-while in main(); each iteration: showstatus → drawboard → out_refresh → in_getch → dispatch key or evaluate gravity"
  key_bindings:
    j/LEFT: "ACTION_LEFT"
    l/RIGHT: "ACTION_RIGHT"
    k/UP/Enter: "ACTION_ROTATE_COUNTERCLOCKWISE"
    K: "ACTION_ROTATE_CLOCKWISE"
    DOWN: "ACTION_DOWN"
    SPACE: "ACTION_DROP then evaluate()"
    s: "enable show-next-piece"
    d: "toggle dotted background lines"
    a: "advance level"
    p: "pause (spin on in_getch)"
    q: "quit"

scoring:
  formula: "SCOREFACTOR * (level * (dropcount+1)) + SCOREFACTOR * (level+10) * droppedlines^2"
  penalties: "halved if shownext=true; halved again if dottedlines=true"
  level_up: "droppedlines / 10 > level → level++ and reset DELAY"

rotation_model:
  description: "fake_rotate() wraps real_rotate() to emulate original Tetris rotation quirks"
  type0: "S-piece — alternates real CCW / CW via flipped flag"
  type1_6: "Z/I-piece — alternates real CW / CCW via flipped flag (2-state)"
  type2_4_5: "T/J/L-piece — full 4-state rotation, direction follows player input"
  type3: "O-piece — never rotated"

shadow:
  description: "When engine->shadow is true, a ghost piece is drawn at drop destination"
  impl: "place_shadow_to_bottom() walks board until collision; shadow drawn before real piece on each move"

bag_randomizer:
  description: "7-bag system: all 7 shapes shuffled, dealt in order, reshuffled before reuse"
  impl: "engine.bag[] shuffled with Fisher-Yates; bag_iterator incremented per piece; reshuffle triggered when (iterator+1)%7==0"

highscores:
  file: "set at compile time via -DSCOREFILE; defaults to /var/games/tint.scores"
  format: "binary: header string + 10 × (name\\0 + int score + time_t timestamp)"
  logic: "savescores() reads file, inserts if score > last entry, qsort descending, rewrites"

build:
  command: "make"
  compiler: "gcc (default) or $CC"
  flags: "-Wall -DSCOREFILE=..."
  link: "-lncurses"
  objects: ["engine.o", "utils.o", "io.o", "tint.o"]

conventions:
  - "All mutable state flows through engine_t* — no global engine state"
  - "IO layer is a thin ncurses wrapper; game logic never calls ncurses directly"
  - "board_t encodes walls as WALL (16) and empty as 0; shape colors are 1-7"
  - "erase-then-redraw pattern for every shape movement: eraseshape → test → drawshape"
  - "Score stored as integer * SCOREFACTOR=2 to retain precision during integer arithmetic"
  - "Shadow piece always drawn before the real piece so real piece overwrites it on overlap"
  - "CLI flags parsed after variable initialisation so defaults are already set"
  - "Highscore file uses raw binary struct layout — not portable across architectures"
